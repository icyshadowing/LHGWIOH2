<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LHGWIOH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <h1>LHGWIOH</h1>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="card">
      <h2>Main Menu</h2>
      <button id="goToPackSelectBtn">Review Quiz</button>
      <button id="startAdvancedQuizBtn">SMC Quiz (12 Verses)</button>
      <button id="viewPacksBtn">View All Packs</button>
    </div>

    <!-- PACK SELECT PAGE -->
    <div id="packSelectCard" class="card hidden">
      <h2>Select Pack(s)</h2>
      <select id="packSelect" size="6"></select>
      <div class="btn-row">
        <button id="startQuizBtn">Start</button>
        <button id="backToMainBtn" class="ghost">Back to Main Menu</button>
      </div>
    </div>

    <!-- QUIZ PAGE -->
    <div id="quizCard" class="card hidden">
      <h2 id="quizRef"></h2>
      <label>Title</label>
      <input id="inputTitle" placeholder="Enter the title">
      <label>Verse</label>
      <textarea id="inputVerse" placeholder="Enter the verse"></textarea>
      <div class="btn-row">
        <button id="submitAnswerBtn">Submit</button>
        <button id="skipBtn" class="ghost">Show Answer</button>
        <button id="backBtn" class="ghost">Back to Menu</button>
      </div>
    </div>

    <!-- REVIEW PAGE -->
    <div id="reviewCard" class="card hidden">
      <h2 id="reviewHeading">Review</h2>
      <div><strong>Correct Title:</strong> <span id="correctTitle"></span></div>
      <div id="correctVerse" class="muted"></div>
      <div><strong>Your Title:</strong> <span id="userTitle"></span></div>
      <div id="userVerseBox" class="user-verse"></div>
      <div class="btn-row">
        <button id="nextBtn">Next</button>
        <button id="retryBtn" class="ghost">Try Again</button>
        <button id="backBtn" class="ghost">Back to Main Menu</button>
      </div>
      <div class="muted" style="margin-top:8px;">
        <strong>Legend:</strong><br>
        Black = correct, Blue = wrong/extra, Red = missing
      </div>
    </div>

    <!-- VIEW PACKS PAGE -->
    <div id="viewPacksCard" class="card hidden">
      <h2>Verse Packs</h2>
      <div class="btn-row">
        <button id="backToMenuBtn" class="ghost">Back to Main Menu</button>
        <button id="backToMenuBtn2" class="ghost">Back to Main Menu</button>
      </div>
      <div id="packsContainer"></div>
    </div>

  </div>

  <script src="data.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
