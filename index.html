<div id="mainMenu" class="menu-card">
  <h2>Main Menu</h2>
  <button id="startQuizBtn">Start Quiz</button>
  <button id="startAdvancedQuizBtn">SMC Quiz (12 Verses)</button>
  <button id="viewPacksBtn">View Packs</button>
</div>

<div id="packSelectCard" class="card hidden">
  <h2>Select Pack(s)</h2>
  <select id="packSelect" size="6"></select>
  <div class="btn-row">
    <button id="startQuizBtn">Start Quiz</button>
    <button id="backToMainBtn">Back to Main Menu</button>
  </div>
</div>

<div id="quizCard" class="card hidden">
  <h2 id="quizRef">Verse Ref</h2>
  <input type="text" id="inputTitle" placeholder="Enter Title">
  <textarea id="inputVerse" placeholder="Enter Verse"></textarea>
  <div class="btn-row">
    <button id="submitAnswerBtn">Submit</button>
    <button id="skipBtn">Skip</button>
    <button id="backBtn">Back to Menu</button>
  </div>
</div>

<div id="reviewCard" class="card hidden">
  <h2 id="reviewHeading">Review</h2>
  <p><strong>Correct Title:</strong> <span id="correctTitle"></span></p>
  <p><strong>Correct Verse:</strong> <span id="correctVerse"></span></p>
  <p><strong>Your Title:</strong> <span id="userTitle"></span></p>
  <p><strong>Your Verse:</strong> <span id="userVerseBox"></span></p>
  <div class="btn-row">
    <button id="nextBtn">Next</button>
    <button id="retryBtn">Retry</button>
    <button id="backBtn">Back to Menu</button>
  </div>
</div>

<div id="viewPacksCard" class="card hidden">
  <h2>All Packs</h2>
  <div id="packsContainer"></div>
  <button id="backToMenuBtn2">Back to Menu</button>
</div>
